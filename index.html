<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specimen — Materials Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #000000;
  --ink: #ffffff;
  --mute: #9a9a9a;
  --oxide: #ffffff;
  --oxide-deep: #ffffff;
  --line: #ffffff;
  --sheet: #000000;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Archivo, "Avenir Next", "Helvetica Neue", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}
.serif { font-family: Archivo, "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 600; }
header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px;
}
.header-inner {
  max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
}
.brand { flex: 1; }
.brand .label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink); }
.brand h1 { margin: 0; font-size: 20px; font-weight: 600; }
main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
.btn {
  min-height: 2.75rem;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  padding: 8px 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
  cursor: pointer; border-radius: 0;
}
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.tabs { display: flex; gap: 8px; overflow-x: auto; margin: 16px 0; }
.tab {
  padding: 8px 16px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; border-radius: 0;
}
.tab.active { background: var(--ink); color: var(--paper); }
.sheet {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 0;
  padding: 16px; margin-bottom: 12px;
}
input, textarea, select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 0;
  font-family: inherit; font-size: 14px; background: #000; color: #fff;
}
textarea { min-height: 80px; resize: vertical; }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; margin: 12px 0 4px; color: var(--mute); }
.row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.photo-preview { max-width: 180px; max-height: 180px; object-fit: cover; margin: 8px; border: 1px solid var(--line); }
.muted { color: var(--mute); font-size: 14px; }
.hidden { display: none; }
.experiment-item { cursor: pointer; }
.experiment-item:hover { background: #111; }

  @keyframes dynamicCycle {
    0%   { opacity: 0; transform: translateY(12px) scale(0.92); }
    6%   { opacity: 1; transform: translateY(0) scale(1); }
    14%  { opacity: 1; transform: translateY(0) scale(1); }
    20%  { opacity: 0; transform: translateY(-12px) scale(1.05); }
    100% { opacity: 0; }
  }
  .anim-line {
    animation: dynamicCycle 9s infinite;
    white-space: nowrap;
  }
  .anim-line:nth-child(1) { animation-delay: 0s; }
  .anim-line:nth-child(2) { animation-delay: 1.5s; }
  .anim-line:nth-child(3) { animation-delay: 3s; }
  .anim-line:nth-child(4) { animation-delay: 4.5s; }
  .anim-line:nth-child(5) { animation-delay: 6s; }
  .anim-line:nth-child(6) { animation-delay: 7.5s; }
  .name-line { text-shadow: 0 0 8px rgba(245,215,110,0.4); }
</style>
</head>
<body>
<header>
  <div id="top-anim" style="height:72px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:1px solid #fff;">
    <div class="anim-line" style="position:absolute;font-size:28px;font-weight:800;letter-spacing:0.1em;opacity:0;">IDES451</div>
    <div class="anim-line" style="position:absolute;font-size:16px;font-weight:600;letter-spacing:0.06em;opacity:0;">INTERIOR COMPONENT DESIGN</div>
    <div class="anim-line name-line" style="position:absolute;font-size:15px;font-weight:700;letter-spacing:0.04em;opacity:0;color:#f5d76e;">ASSOCIATE PROFESSOR ROBERT BROOKS</div>
    <div class="anim-line" style="position:absolute;font-size:14px;font-weight:500;letter-spacing:0.08em;opacity:0;">FALL 2026–2027</div>
    <div class="anim-line" style="position:absolute;font-size:14px;font-weight:500;letter-spacing:0.08em;opacity:0;">SCHOOL OF DESIGN</div>
    <div class="anim-line" style="position:absolute;font-size:14px;font-weight:500;letter-spacing:0.08em;opacity:0;">LOUISIANA TECH UNIVERSITY</div>
  </div>
  <div class="header-inner">
    <div class="brand">
      <div class="label">SPECIMEN</div>
      <h1 class="serif">Materials Research</h1>
    </div>
    <div id="user-label" class="muted"></div>
    <button id="sign-out" class="btn btn-quiet hidden">Sign out</button>
  </div>
</header>

<main id="app"></main>

<script>
const STORAGE_KEY = 'specimen-v2';
const INSTRUCTOR_CODE = 'kiln-bench';

let state = loadState();

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) return JSON.parse(raw);
  return {
    students: [
      { id: 'brooks', name: 'Brooks', passcode: 'wax-brass-28', note: '' }
    ],
    experiments: [
      {
        id: 'exp1', studentId: 'brooks', name: 'Wall tile',
        startDate: '2026-10-13', endDate: '2026-10-13',
        deliverables: '4” wall tile',
        ingredients: [
          { name: 'Water', proportion: '1 oz' },
          { name: 'Lime', proportion: '2 oz' },
          { name: 'Peanut shells', proportion: '' }
        ],
        attempted: '',
        links: [],
        sources: [
          { ingredient: 'Water', supplier: 'Tap', link: '' },
          { ingredient: 'Lime', supplier: 'Lowes', link: 'Lowe’s.com' },
          { ingredient: 'Peanut shells', supplier: '', link: '' }
        ],
        studioNote: '',
        testing: { date: '', observations: '', quantitative: '', photos: [] }
      }
    ],
    prompts: [
      { id: 'name', label: 'Experiment name', guidance: 'Give the experiment a name the studio can say out loud.', type: 'short' },
      { id: 'start', label: 'Start date', guidance: 'When the work begins.', type: 'date' },
      { id: 'end', label: 'End date', guidance: 'When you expect to finish, or when it actually ended.', type: 'date' },
      { id: 'deliverables', label: 'Deliverables', guidance: 'What are you attempting to make?', type: 'long' },
      { id: 'ingredients', label: 'Proposed ingredients / materials', guidance: 'Binders, aggregates, finishes, fasteners, salvaged pieces — whatever you propose to use.', type: 'ingredients' },
      { id: 'attempted', label: 'Who has attempted this', guidance: 'Who has attempted the same experiment, or done it in the past?', type: 'long' },
      { id: 'links', label: 'Links to resources', guidance: 'Papers, specifications, videos, and precedent projects.', type: 'links' },
      { id: 'sources', label: 'Sources for the ingredients', guidance: 'The ingredient column follows Proposed ingredients. Add the supplier, site, lab, or salvage pile, and a link if you have one.', type: 'sources' }
    ],
    currentUser: null,
    view: 'login'
  };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function render() {
  const app = document.getElementById('app');
  const userLabel = document.getElementById('user-label');
  const signOut = document.getElementById('sign-out');

  if (!state.currentUser) {
    userLabel.textContent = '';
    signOut.classList.add('hidden');
    app.innerHTML = renderLogin();
    bindLogin();
    return;
  }

  const user = state.currentUser;
  userLabel.textContent = user.role === 'instructor' ? 'Studio' : user.name;
  signOut.classList.remove('hidden');
  signOut.onclick = () => {
    state.currentUser = null;
    state.view = 'login';
    state.currentExperimentId = null;
    saveState();
    render();
  };

  if (state.view === 'experiment' && state.currentExperimentId) {
    const expExists = state.experiments.some(e => e.id === state.currentExperimentId);
    if (!expExists) {
      state.view = user.role === 'instructor' ? 'studio' : 'home';
      state.currentExperimentId = null;
    }
  }

  if (state.view === 'experiment' && state.currentExperimentId) {
    try {
      app.innerHTML = renderExperiment(state.currentExperimentId);
      bindExperiment();
    } catch (err) {
      console.error(err);
      app.innerHTML = `<div class="sheet"><h3>Error opening experiment</h3><pre>${err.message}</pre><button class="btn" onclick="backToList()">Back</button></div>`;
    }
  } else if (user.role === 'instructor') {
    app.innerHTML = renderStudio();
    bindStudio();
  } else {
    app.innerHTML = renderStudentHome();
    bindStudentHome();
  }
}

function renderLogin() {
  return `
    <div style="max-width:420px;margin:40px auto;">
      <h2 class="serif" style="font-size:28px;margin-bottom:8px;">A log for material experiments.</h2>
      <p class="muted">Materials Research. Your passcode opens only your projects.</p>
      <div class="sheet" style="margin-top:24px;">
        <h3 class="serif" style="margin-top:0;">Open the log</h3>
        <p class="muted">Use the passcode the studio gave you.</p>
        <label>PASSCODE</label>
        <input id="passcode" type="text" autocomplete="off">
        <button id="open-log" class="btn btn-primary" style="margin-top:12px;width:100%;">OPEN THE LOG</button>
        <p class="muted" style="margin-top:16px;font-size:12px;">Studio setup. Instructor passcode: <strong>kiln-bench</strong>. Turn this note off under Studio before students use the page.</p>
      </div>
    </div>
  `;
}

function bindLogin() {
  document.getElementById('open-log').onclick = () => {
    const code = document.getElementById('passcode').value.trim();
    if (code === INSTRUCTOR_CODE) {
      state.currentUser = { role: 'instructor' };
      state.view = 'studio';
      state.currentExperimentId = null;
      state.studioTab = 'roster';
      saveState(); render(); return;
    }
    const student = state.students.find(s => s.passcode === code);
    if (student) {
      state.currentUser = { role: 'student', id: student.id, name: student.name };
      state.view = 'home';
      state.currentExperimentId = null;
      saveState(); render(); return;
    }
    alert('Unknown passcode.');
  };
}

function renderStudio() {
  const tab = state.studioTab || 'roster';
  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 class="serif" style="font-size:36px;margin:0;">Studio desk</h1>
        <p class="muted" style="max-width:520px;">Passcodes, experiments, and the questions themselves. Change the prompts and every project follows.</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${tab==='roster'?'active':''}" data-tab="roster">ROSTER</button>
      <button class="tab ${tab==='experiments'?'active':''}" data-tab="experiments">EXPERIMENTS</button>
      <button class="tab ${tab==='prompts'?'active':''}" data-tab="prompts">PROMPTS</button>
      <button class="tab ${tab==='studio'?'active':''}" data-tab="studio">STUDIO</button>
    </div>
    <div id="studio-content">${renderStudioTab(tab)}</div>
  `;
}

function renderStudioTab(tab) {
  if (tab === 'roster') {
    return `
      <div class="sheet">
        <h3 class="serif" style="margin-top:0;">Add a student</h3>
        <p class="muted">Leave the passcode blank to generate one you can read aloud.</p>
        <label>NAME</label><input id="new-name">
        <label>PASSCODE</label><input id="new-pass">
        <label>NOTE</label><input id="new-note">
        <button id="add-student" class="btn btn-primary" style="margin-top:12px;">ADD TO THE ROSTER</button>
      </div>
      ${state.students.map(s => {
        const count = state.experiments.filter(e => e.studentId === s.id).length;
        return `
          <div class="sheet">
            <h3 class="serif" style="margin:0;">${s.name}</h3>
            <p class="muted">${s.passcode} · ${count} experiment${count!==1?'s':''}</p>
            <button class="btn btn-ghost" onclick="copyCode('${s.passcode}')">Copy</button>
            <button class="btn btn-ghost" onclick="removeStudent('${s.id}')">REMOVE</button>
          </div>
        `;
      }).join('')}
    `;
  }
  if (tab === 'experiments') {
    return state.students.map(s => {
      const exps = state.experiments.filter(e => e.studentId === s.id);
      return `
        <div class="sheet">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3 class="serif" style="margin:0;">${s.name}</h3>
            <button class="btn" onclick="newExperiment('${s.id}')">NEW EXPERIMENT</button>
          </div>
          ${exps.map(e => `
            <div class="experiment-item sheet" data-exp-id="${e.id}" style="margin-top:8px;padding:12px;cursor:pointer;">
              <strong>${e.name || 'Untitled'}</strong>
              <div class="muted">${e.startDate || '—'} – ${e.endDate || '—'} · ${(e.ingredients||[]).map(i=>i.name).filter(Boolean).join(' · ') || 'no materials'}</div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  }
  if (tab === 'prompts') {
    return `
      <p class="muted">These questions are the assignment. The Testing tab is always available on every experiment and does not appear here.</p>
      ${state.prompts.map(p => `
        <div class="sheet">
          <strong>${p.type}</strong>
          <label>LABEL</label><input value="${p.label}" onchange="updatePrompt('${p.id}','label',this.value)">
          <label>GUIDANCE</label><textarea onchange="updatePrompt('${p.id}','guidance',this.value)">${p.guidance}</textarea>
        </div>
      `).join('')}
    `;
  }
  return `<div class="sheet"><p class="muted">Instructor passcode is <strong>kiln-bench</strong>. Data is stored in this browser’s localStorage. Clear site data to reset.</p></div>`;
}

function bindStudio() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { state.studioTab = t.dataset.tab; saveState(); render(); };
  });
  const addBtn = document.getElementById('add-student');
  if (addBtn) addBtn.onclick = () => {
    const name = document.getElementById('new-name').value.trim();
    if (!name) return alert('Name required');
    let pass = document.getElementById('new-pass').value.trim();
    if (!pass) pass = Math.random().toString(36).slice(2,8) + '-' + Math.random().toString(36).slice(2,6);
    const id = 's' + Date.now();
    state.students.push({ id, name, passcode: pass, note: document.getElementById('new-note').value });
    saveState(); render();
  };
}

function copyCode(code) { navigator.clipboard.writeText(code); alert('Copied: ' + code); }
function removeStudent(id) {
  if (!confirm('Remove this student and all their experiments?')) return;
  state.students = state.students.filter(s => s.id !== id);
  state.experiments = state.experiments.filter(e => e.studentId !== id);
  saveState(); render();
}
function newExperiment(studentId) {
  const id = 'e' + Date.now();
  state.experiments.push({
    id, studentId, name: '', startDate: '', endDate: '', deliverables: '',
    ingredients: [{ name: '', proportion: '' }], attempted: '', links: [], sources: [],
    studioNote: '', testing: { date: '', observations: '', quantitative: '', photos: [] }
  });
  state.currentExperimentId = id;
  state.view = 'experiment';
  saveState(); render();
}
function openExperimentAsInstructor(id) {
  state.currentExperimentId = id;
  state.view = 'experiment';
  saveState(); render();
}
function updatePrompt(id, field, value) {
  const p = state.prompts.find(x => x.id === id);
  if (p) p[field] = value;
  saveState();
}

function renderStudentHome() {
  const student = state.currentUser;
  const exps = state.experiments.filter(e => e.studentId === student.id);
  return `
    <h1 class="serif" style="font-size:36px;margin:0 0 8px;">${student.name}</h1>
    <button class="btn btn-primary" onclick="newExperiment('${student.id}')">NEW EXPERIMENT</button>
    <p class="muted" style="margin-top:16px;">Give the experiment a name. Record what you are trying to make, the materials you propose, who has attempted this before, and where those materials come from. Use the Testing tab to record results and photos.</p>
    ${exps.map(e => `
      <div class="experiment-item sheet" data-exp-id="${e.id}" style="cursor:pointer;">
        <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;color:var(--oxide-deep);">01</div>
        <h3 class="serif" style="margin:4px 0;">${e.name || 'Untitled'}</h3>
        <div class="muted">${e.startDate || '—'} – ${e.endDate || '—'}</div>
        <div class="muted">${(e.ingredients||[]).map(i=>i.name).filter(Boolean).join(' · ') || ''}</div>
      </div>
    `).join('')}
  `;
}

function bindStudentHome() {
  // handled by global delegation below
}

// Global click delegation so experiment cards always respond
document.addEventListener('click', function(e) {
  const card = e.target.closest('[data-exp-id]');
  if (card) {
    e.preventDefault();
    openExperiment(card.dataset.expId);
  }
});
function openExperiment(id) {
  try {
    state.currentExperimentId = id;
    state.view = 'experiment';
    state.expTab = 'brief';
    saveState();
    render();
  } catch (err) {
    console.error(err);
    alert('Could not open experiment: ' + err.message);
  }
}

function renderExperiment(id) {
  const exp = state.experiments.find(e => e.id === id);
  if (!exp) return '<p>Experiment not found.</p>';
  const student = state.students.find(s => s.id === exp.studentId) || { name: 'Unknown' };
  const isInstructor = state.currentUser.role === 'instructor';
  const tab = state.expTab || 'brief';

  return `
    <button class="btn btn-quiet" onclick="backToList()">← ${isInstructor ? 'STUDIO DESK' : 'EXPERIMENTS'}</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0;">
      <p class="muted">You are writing in <strong>${student.name}</strong>'s log.</p>
      <div>
        <button class="btn" onclick="copyBrief('${exp.id}')">COPY BRIEF</button>
        <button class="btn" onclick="window.print()">PRINT</button>
        ${isInstructor ? `<button class="btn" onclick="removeExperiment('${exp.id}')">REMOVE EXPERIMENT</button>` : ''}
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${tab==='brief'?'active':''}" data-exptab="brief">BRIEF</button>
      <button class="tab ${tab==='testing'?'active':''}" data-exptab="testing">TESTING</button>
    </div>
    <div id="exp-content">${tab === 'testing' ? renderTesting(exp) : renderBrief(exp, isInstructor)}</div>
  `;
}

function renderBrief(exp, isInstructor) {
  return `
    <div class="sheet"><h3 class="serif">01 Experiment name</h3><p class="muted">Give the experiment a name the studio can say out loud.</p><input value="${esc(exp.name)}" oninput="updateExp('${exp.id}','name',this.value)"></div>
    <div class="sheet"><h3 class="serif">02 Start date</h3><p class="muted">When the work begins.</p><input type="date" value="${exp.startDate||''}" oninput="updateExp('${exp.id}','startDate',this.value)"></div>
    <div class="sheet"><h3 class="serif">03 End date</h3><p class="muted">When you expect to finish, or when it actually ended.</p><input type="date" value="${exp.endDate||''}" oninput="updateExp('${exp.id}','endDate',this.value)"></div>
    <div class="sheet"><h3 class="serif">04 Deliverables</h3><p class="muted">What are you attempting to make?</p><textarea oninput="updateExp('${exp.id}','deliverables',this.value)">${esc(exp.deliverables||'')}</textarea></div>
    <div class="sheet">
      <h3 class="serif">05 Proposed ingredients / materials</h3>
      <p class="muted">Binders, aggregates, finishes, fasteners, salvaged pieces — whatever you propose to use.</p>
      <div id="ing-list">${(exp.ingredients||[]).map((ing,i) => `
        <div class="row">
          <input placeholder="Material" value="${esc(ing.name)}" oninput="updateIng('${exp.id}',${i},'name',this.value)">
          <input placeholder="Proportion or preparation" value="${esc(ing.proportion)}" oninput="updateIng('${exp.id}',${i},'proportion',this.value)">
          <button class="btn btn-ghost" onclick="removeIng('${exp.id}',${i})">✕</button>
        </div>
      `).join('')}</div>
      <button class="btn" onclick="addIng('${exp.id}')">ADD AN INGREDIENT</button>
    </div>
    <div class="sheet"><h3 class="serif">06 Who has attempted this</h3><p class="muted">Who has attempted the same experiment, or done it in the past?</p><textarea oninput="updateExp('${exp.id}','attempted',this.value)">${esc(exp.attempted||'')}</textarea></div>
    <div class="sheet"><h3 class="serif">07 Links to resources</h3><p class="muted">Papers, specifications, videos, and precedent projects.</p>
      ${(exp.links||[]).map((l,i) => `<input value="${esc(l)}" oninput="updateLink('${exp.id}',${i},this.value)" style="margin-bottom:6px;">`).join('')}
      <button class="btn" onclick="addLink('${exp.id}')">ADD A LINK</button>
    </div>
    <div class="sheet">
      <h3 class="serif">08 Sources for the ingredients</h3>
      <p class="muted">The ingredient column follows Proposed ingredients. Add the supplier, site, lab, or salvage pile, and a link if you have one.</p>
      <div id="src-list">${(exp.sources||[]).map((src,i) => `
        <div class="row" style="grid-template-columns:1fr 1fr 1fr auto;">
          <input placeholder="Ingredient" value="${esc(src.ingredient)}" oninput="updateSrc('${exp.id}',${i},'ingredient',this.value)">
          <input placeholder="Supplier, site, or lab" value="${esc(src.supplier)}" oninput="updateSrc('${exp.id}',${i},'supplier',this.value)">
          <input placeholder="Link" value="${esc(src.link)}" oninput="updateSrc('${exp.id}',${i},'link',this.value)">
          <button class="btn btn-ghost" onclick="removeSrc('${exp.id}',${i})">✕</button>
        </div>
      `).join('')}</div>
      <button class="btn" onclick="addSrc('${exp.id}')">ADD A SOURCE</button>
    </div>
    ${isInstructor ? `<div class="sheet"><h3 class="serif">From the studio</h3><p class="muted">Students can read this. Only you can change it.</p><textarea oninput="updateExp('${exp.id}','studioNote',this.value)">${esc(exp.studioNote||'')}</textarea></div>` : (exp.studioNote ? `<div class="sheet"><h3 class="serif">From the studio</h3><p>${esc(exp.studioNote)}</p></div>` : '')}
  `;
}

function renderTesting(exp) {
  const t = exp.testing || { date: '', observations: '', quantitative: '', photos: [] };
  const ingSummary = (exp.ingredients||[]).filter(i=>i.name).map(i => `${i.name}${i.proportion ? ' ('+i.proportion+')' : ''}`).join(', ') || '—';
  return `
    <div class="sheet" style="background:#faf8f4;">
      <strong>Auto-populated from brief</strong>
      <div class="muted" style="margin-top:8px;">
        Experiment: <strong>${esc(exp.name||'Untitled')}</strong><br>
        Deliverables: ${esc(exp.deliverables||'—')}<br>
        Dates: ${exp.startDate||'—'} – ${exp.endDate||'—'}<br>
        Ingredients: ${ingSummary}
      </div>
    </div>
    <div class="sheet">
      <h3 class="serif">Testing date</h3>
      <input type="date" value="${t.date||''}" oninput="updateTesting('${exp.id}','date',this.value)">
    </div>
    <div class="sheet">
      <h3 class="serif">Observations / results</h3>
      <p class="muted">Strength, shrinkage, color, failure mode, workability, surprises.</p>
      <textarea oninput="updateTesting('${exp.id}','observations',this.value)">${esc(t.observations||'')}</textarea>
    </div>
    <div class="sheet">
      <h3 class="serif">Quantitative data</h3>
      <p class="muted">Dimensions, weight, force, density, or any measured values.</p>
      <textarea oninput="updateTesting('${exp.id}','quantitative',this.value)">${esc(t.quantitative||'')}</textarea>
    </div>
    <div class="sheet">
      <h3 class="serif">Photos (one or two)</h3>
      <p class="muted">Specimen, test setup, or failure surface. Stored in this browser.</p>
      <input type="file" accept="image/*" multiple onchange="addPhotos('${exp.id}', this)">
      <div id="photo-box" style="margin-top:12px;">
        ${(t.photos||[]).map((src,i) => `
          <div style="display:inline-block;position:relative;margin-right:12px;">
            <img class="photo-preview" src="${src}">
            <button class="btn btn-ghost" style="position:absolute;top:4px;right:4px;padding:2px 6px;" onclick="removePhoto('${exp.id}',${i})">✕</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function bindExperiment() {
  document.querySelectorAll('[data-exptab]').forEach(t => {
    t.onclick = () => { state.expTab = t.dataset.exptab; saveState(); render(); };
  });
}

function backToList() {
  state.view = state.currentUser.role === 'instructor' ? 'studio' : 'home';
  state.currentExperimentId = null;
  saveState(); render();
}
function removeExperiment(id) {
  if (!confirm('Remove this experiment?')) return;
  state.experiments = state.experiments.filter(e => e.id !== id);
  backToList();
}
function updateExp(id, field, value) {
  const e = state.experiments.find(x => x.id === id);
  if (e) e[field] = value;
  saveState();
}
function updateIng(id, idx, field, value) {
  const e = state.experiments.find(x => x.id === id);
  if (e && e.ingredients[idx]) e.ingredients[idx][field] = value;
  saveState();
}
function addIng(id) {
  const e = state.experiments.find(x => x.id === id);
  if (e) e.ingredients.push({ name: '', proportion: '' });
  saveState(); render();
}
function removeIng(id, idx) {
  const e = state.experiments.find(x => x.id === id);
  if (e) e.ingredients.splice(idx, 1);
  saveState(); render();
}
function addLink(id) {
  const e = state.experiments.find(x => x.id === id);
  if (e) { e.links = e.links || []; e.links.push(''); }
  saveState(); render();
}
function updateLink(id, idx, value) {
  const e = state.experiments.find(x => x.id === id);
  if (e && e.links) e.links[idx] = value;
  saveState();
}
function addSrc(id) {
  const e = state.experiments.find(x => x.id === id);
  if (e) { e.sources = e.sources || []; e.sources.push({ ingredient: '', supplier: '', link: '' }); }
  saveState(); render();
}
function updateSrc(id, idx, field, value) {
  const e = state.experiments.find(x => x.id === id);
  if (e && e.sources[idx]) e.sources[idx][field] = value;
  saveState();
}
function removeSrc(id, idx) {
  const e = state.experiments.find(x => x.id === id);
  if (e) e.sources.splice(idx, 1);
  saveState(); render();
}
function updateTesting(id, field, value) {
  const e = state.experiments.find(x => x.id === id);
  if (!e.testing) e.testing = { date: '', observations: '', quantitative: '', photos: [] };
  e.testing[field] = value;
  saveState();
}
function addPhotos(id, input) {
  const e = state.experiments.find(x => x.id === id);
  if (!e.testing) e.testing = { date: '', observations: '', quantitative: '', photos: [] };
  const remaining = 2 - (e.testing.photos || []).length;
  if (remaining <= 0) { alert('Maximum two photos.'); return; }
  Array.from(input.files).slice(0, remaining).forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      e.testing.photos.push(reader.result);
      saveState();
      render();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}
function removePhoto(id, idx) {
  const e = state.experiments.find(x => x.id === id);
  if (e && e.testing) e.testing.photos.splice(idx, 1);
  saveState(); render();
}
function copyBrief(id) {
  const e = state.experiments.find(x => x.id === id);
  const text = `Experiment: ${e.name}\nDates: ${e.startDate} – ${e.endDate}\nDeliverables: ${e.deliverables}\nIngredients: ${(e.ingredients||[]).map(i=>i.name+' '+i.proportion).join(', ')}`;
  navigator.clipboard.writeText(text);
  alert('Brief copied.');
}
function esc(s) { return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/"/g,'"'); }

render();
</script>
</body>
</html>
